# Override: docker compose -f compose.yaml -f compose.macvlan.yaml up -d --build
# Or use .env.macvlan.example: COMPOSE_FILE selects both files.
services:
  ps5-host:
    # An empty list without !reset would keep the ports inherited from the base file.
    ports: !reset []
    networks:
      ps5-lan:
        ipv4_address: ${HOST_IP:?Set HOST_IP to an unused LAN IPv4 address for the container}

networks:
  ps5-lan:
    driver: macvlan
    driver_opts:
      parent: ${MACVLAN_PARENT:?Set MACVLAN_PARENT to the Docker host LAN interface}
      macvlan_mode: bridge
    ipam:
      config:
        - subnet: ${MACVLAN_SUBNET:?Set MACVLAN_SUBNET, e.g. 192.168.1.0/24}
          gateway: ${MACVLAN_GATEWAY:?Set MACVLAN_GATEWAY to the router IP address}
