name: Publish versioned images

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - '.github/workflows/publish-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.ref }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Bootstrap the existing releases; later tag pushes publish that tag only.
        ref: ${{ fromJSON(github.ref_type == 'tag' && format('["{0}"]', github.ref_name) || '["v0.7.0","v0.7.1"]') }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/marchrius/ps5-webkit-autoloader-docker
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ matrix.ref }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
