services:
  ps5-host:
    build:
      context: .
      args:
        AUTOLOADER_VERSION: ${AUTOLOADER_VERSION:-0.5.2}
        AUTOLOADER_SHA256: ${AUTOLOADER_SHA256:-}
    image: ps5-webkit-autoloader-dns:local
    restart: unless-stopped
    environment:
      HOST_IP: ${HOST_IP:?Imposta HOST_IP nel file .env con IPv4 LAN raggiungibile dalla PS5}
      DNS_MODE: ${DNS_MODE:-selective}
      UPSTREAM_DNS: ${UPSTREAM_DNS:-1.1.1.1,9.9.9.9}
      LOG_QUERIES: ${LOG_QUERIES:-false}
    ports:
      - "${BIND_IP:-0.0.0.0}:53:53/udp"
      - "${BIND_IP:-0.0.0.0}:53:53/tcp"
      - "${BIND_IP:-0.0.0.0}:80:80/tcp"
      - "${BIND_IP:-0.0.0.0}:443:443/tcp"
    volumes:
      - ./config:/config:ro
    read_only: true
    tmpfs:
      - /tmp
      - /run
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
